<a
  class="project-card"
  [routerLink]="['/p', card().slug]"
  [class.project-card--alert]="card().openAlerts > 0"
>
  <div class="project-card__head">
    <div class="project-card__title">
      <pl-status-dot [state]="card().status" />
      <h3 class="project-card__name">{{ card().name }}</h3>
    </div>
    <div class="project-card__meta">
      @if (card().openAlerts > 0) {
        <span class="pl-chip pl-chip--coral">{{ alertLabel() }}</span>
      }
      <span class="pl-chip pl-chip--muted">{{ kindLabel() }}</span>
    </div>
  </div>

  <div class="project-card__numbers">
    @for (n of numbers(); track n.key) {
      <div class="project-card__number">
        <span class="project-card__value pl-num" [class.pl-muted]="n.value === null">{{
          n.display
        }}</span>
        <span class="project-card__label">{{ n.label }}</span>
      </div>
    }
  </div>

  <pl-sparkline [points]="card().sparkline" [label]="card().name + ' visitors'" />
</a>
