@if (showShell()) {
  <div class="shell">
    <aside class="shell__rail">
      <a
        class="brand brand--rail"
        routerLink="/"
        aria-label="Pulse — All projects"
        [class.brand--live]="shell.refreshing()"
      >
        <svg class="brand__trace" viewBox="0 0 44 16" aria-hidden="true">
          <path
            d="M1 9h9l3-6 5 12 4-9 3 3h18"
            pathLength="1"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </svg>
        <span class="brand__mark">Pulse</span>
      </a>

      <pl-bottom-nav class="shell__nav" />

      <div class="rail__foot">
        <span class="rail__by">by ROGUETECHNOLOGIES</span>
        <button type="button" class="rail__out" (click)="logout()">
          <lucide-icon [img]="icons.logout" [size]="16" aria-hidden="true" />
          Sign out
        </button>
      </div>
    </aside>

    <header class="topbar">
      <a
        class="brand brand--top"
        routerLink="/"
        aria-label="Pulse — All projects"
        [class.brand--live]="shell.refreshing()"
      >
        <svg class="brand__trace" viewBox="0 0 44 16" aria-hidden="true">
          <path
            d="M1 9h9l3-6 5 12 4-9 3 3h18"
            pathLength="1"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </svg>
        <span class="brand__mark">Pulse</span>
      </a>

      <pl-project-pills class="topbar__pills" />
      <pl-range-toggle class="topbar__range" />

      <div class="topbar__tools">
        <pl-refresh-indicator />
        <pl-notices-bell />
        <button
          type="button"
          class="pl-btn pl-btn--ghost pl-btn--icon topbar__out"
          (click)="logout()"
          aria-label="Sign out"
          title="Sign out"
        >
          <lucide-icon [img]="icons.logout" [size]="18" aria-hidden="true" />
        </button>
      </div>
    </header>

    <main class="shell__content" id="main">
      <router-outlet />
    </main>

    <div class="shell__ask">
      <pl-ask-bar />
    </div>

    <pl-confirm-sheet
      [open]="actions.isOpen()"
      [title]="actions.pending()?.title ?? ''"
      [sentence]="actions.pending()?.sentence ?? ''"
      [busy]="actions.busy()"
      [result]="actions.lastResult()"
      [error]="actions.error()"
      (confirm)="actions.confirm()"
      (cancel)="actions.cancel()"
      (dismiss)="actions.dismiss()"
    />
  </div>
} @else {
  <router-outlet />
}

<pl-toasts />
