@if (showShell()) {
  <div class="shell">
    <header class="topbar">
      <div class="topbar__row">
        <a class="brand" routerLink="/" aria-label="Pulse — All projects">
          <span class="brand__mark">Pulse</span>
          <span class="brand__by">by ROGUETECHNOLOGIES</span>
        </a>
        <div class="topbar__tools">
          <pl-refresh-indicator />
          <pl-notices-bell />
          <button
            type="button"
            class="pl-btn pl-btn--ghost pl-btn--icon"
            (click)="logout()"
            aria-label="Sign out"
            title="Sign out"
          >
            <lucide-icon [img]="icons.logout" [size]="18" aria-hidden="true" />
          </button>
        </div>
      </div>
      <pl-project-pills />
      <div class="topbar__row topbar__row--range">
        <pl-range-toggle />
      </div>
    </header>

    <pl-bottom-nav class="shell__nav" />

    <main class="shell__content" id="main">
      <router-outlet />
    </main>

    <pl-ask-bar class="shell__ask" />

    <pl-confirm-sheet
      [open]="actions.isOpen()"
      [title]="actions.pending()?.title ?? ''"
      [sentence]="actions.pending()?.sentence ?? ''"
      [busy]="actions.busy()"
      [result]="actions.lastResult()"
      [error]="actions.error()"
      (confirm)="actions.confirm()"
      (cancel)="actions.cancel()"
      (dismiss)="actions.dismiss()"
    />
  </div>
} @else {
  <router-outlet />
}

<pl-toasts />
